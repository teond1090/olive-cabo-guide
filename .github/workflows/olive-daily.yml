name: Olive daily briefing

on:
  schedule:
    # 13:00 UTC = 7:00 AM Mountain Daylight Time.
    # August only - the Great American West trip runs Aug 17-31, 2026,
    # with a countdown nudge for the two weeks before it.
    - cron: '0 13 * 8 *'
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Post the morning briefing to the crew chat
        env:
          OLIVE_CHAT_TOPIC: ${{ secrets.OLIVE_CHAT_TOPIC }}
        run: python3 scripts/daily_briefing.py
